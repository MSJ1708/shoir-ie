<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoir-IE Excel Bridge</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:18px;color:#0f172a}
h1{font-size:22px;margin:0 0 6px}p{color:#64748b;font-size:13px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 5px}
input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #cbd5e1}
button{margin-top:9px;font-weight:700;cursor:pointer}
.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
#status{margin-top:14px;padding:10px;background:#f1f5f9;border-radius:9px;font-size:12px}
</style></head>
<body>
<h1>Shoir-IE Excel Bridge</h1>
<p>Send the selected Excel range into a configured Shoir-IE deployment, or copy it for manual import.</p>
<label for="host">Shoir-IE API host</label>
<input id="host" placeholder="https://your-shoir-ie-host">
<button id="saveHost">Save host</button>
<button id="sendSelection" class="primary">Send selected range to Shoir-IE</button>
<button id="copySelection">Copy selected range as JSON</button>
<div id="status">Bridge status: not connected.</div>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="./taskpane.js"></script>
</body></html>
