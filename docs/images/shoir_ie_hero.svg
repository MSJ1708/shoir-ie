<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Shoir-IE Industrial Engineering Command Center</title>
<desc id="desc">Visual overview showing industrial data flowing through engineering methods, optimization, simulation and AI into decisions, verification and reporting.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="58%" stop-color="#102a56"/>
    <stop offset="100%" stop-color="#0b5361"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#2dd4bf"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".22"/>
  </filter>
</defs>
<rect width="1400" height="620" rx="34" fill="url(#bg)"/>
<circle cx="1200" cy="95" r="170" fill="#38bdf8" opacity=".06"/>
<circle cx="1300" cy="510" r="260" fill="#2dd4bf" opacity=".05"/>

<text x="70" y="82" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2.4">INDUSTRIAL DECISION INTELLIGENCE</text>
<text x="70" y="135" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="850">Shoir-IE</text>
<text x="70" y="177" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Industrial Engineering Command Center</text>
<text x="70" y="213" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Connect data, engineering methods, scenarios, optimization, simulation,</text>
<text x="70" y="239" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">AI-assisted workflows and verification in one decision loop.</text>

<g filter="url(#shadow)">
  <rect x="70" y="294" width="210" height="145" rx="20" fill="#ffffff" opacity=".97"/>
  <rect x="305" y="294" width="210" height="145" rx="20" fill="#ffffff" opacity=".97"/>
  <rect x="540" y="294" width="210" height="145" rx="20" fill="#ffffff" opacity=".97"/>
  <rect x="775" y="294" width="210" height="145" rx="20" fill="#ffffff" opacity=".97"/>
  <rect x="1010" y="294" width="320" height="145" rx="20" fill="#ffffff" opacity=".97"/>
</g>

<g fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="94" y="333" font-size="14" font-weight="800" fill="#0f766e">01 · PREPARE</text>
  <text x="94" y="368" font-size="20" font-weight="800">Industrial Data</text>
  <text x="94" y="397" font-size="14" fill="#64748b">Validate · clean · connect</text>

  <text x="329" y="333" font-size="14" font-weight="800" fill="#0f766e">02 · ENGINEER</text>
  <text x="329" y="368" font-size="20" font-weight="800">Methods</text>
  <text x="329" y="397" font-size="14" fill="#64748b">OR · quality · economics</text>

  <text x="564" y="333" font-size="14" font-weight="800" fill="#0f766e">03 · STRESS-TEST</text>
  <text x="564" y="368" font-size="20" font-weight="800">Scenarios</text>
  <text x="564" y="397" font-size="14" fill="#64748b">Simulate · compare · optimize</text>

  <text x="799" y="333" font-size="14" font-weight="800" fill="#0f766e">04 · DECIDE</text>
  <text x="799" y="368" font-size="20" font-weight="800">Decision Center</text>
  <text x="799" y="397" font-size="14" fill="#64748b">Explain · approve · act</text>

  <text x="1034" y="333" font-size="14" font-weight="800" fill="#0f766e">05 · CLOSE THE LOOP</text>
  <text x="1034" y="368" font-size="20" font-weight="800">Verify &amp; Report</text>
  <text x="1034" y="397" font-size="14" fill="#64748b">Prediction vs actual · exports · learning</text>
</g>

<g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M280 366 H305"/>
  <path d="M515 366 H540"/>
  <path d="M750 366 H775"/>
  <path d="M985 366 H1010"/>
</g>

<g stroke="#7dd3fc" stroke-width="2" opacity=".4">
  <path d="M175 440 V505 H1225 V440"/>
</g>

<text x="70" y="548" fill="#e0f2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">The differentiator:</text>
<text x="235" y="548" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">one connected workflow instead of a collection of disconnected engineering tools.</text>
</svg>