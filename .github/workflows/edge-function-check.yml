name: Shoir-IE Edge Function verification

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-function-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-function-check.yml"

permissions:
  contents: read

jobs:
  edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function formatting
        run: deno fmt --check supabase/functions/shoir-persistence/index.ts
      - name: Type-check Edge Function
        run: deno check supabase/functions/shoir-persistence/index.ts
