name: Shoir-IE Edge Function verification

on:
  push:
    branches: ["main", "staging-e2e-20261019", "feature/**", "feat/**", "fix/**", "hotfix/**", "integration/**"]
    paths:
      - "supabase/functions/**"
      - "supabase/production-hotfix-v8/**"
      - "supabase/migrations/**"
      - ".github/workflows/edge-function-check.yml"
      - "tests/test_full_migration_history_postgres.py"
      - "tests/test_migration_source_inventory.py"
  pull_request:
    # This check is required on main; do not path-skip it on migration/export/docs
    # PRs that still need the same release gate. It also supplies the staging
    # function check so the staging candidate can be validated before deployment.
    branches: ["main", "staging-e2e-20261019", "feat/shoir-100-tools-integration-20261025"]

permissions:
  contents: read

jobs:
  edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function and security helper formatting
        run: deno fmt --check supabase/functions/shoir-persistence/index.ts supabase/functions/shoir-persistence/security.ts supabase/functions/shoir-persistence/security_test.ts
      - name: Type-check Edge Function and security helper tests
        run: deno check supabase/functions/shoir-persistence/index.ts supabase/functions/shoir-persistence/security_test.ts
      - name: Test bounded request parsing and safe error mapping
        run: deno test supabase/functions/shoir-persistence/security_test.ts
