name: Apply persistent workspace integration

on:
  push:
    branches:
      - feat/persistent-user-workspaces

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-user-workspaces
          fetch-depth: 0

      - name: Integrate persistence into app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")

          if "from workspace_persistence import" not in text:
              import_marker = "from industrial_excellence_hub import render_platform_excellence_hub"
              import_patch = import_marker + "\nfrom workspace_persistence import ensure_workspace_state_db, load_user_workspace, save_user_workspace"
              if import_marker not in text:
                  raise SystemExit("Import marker not found")
              text = text.replace(import_marker, import_patch, 1)

          load_marker = """# =====================================================================
# ENSURE AFFILIATE CODE IS LOADED IN SESSION STATE
# ====================================================================="""
          load_patch = """# =====================================================================
# PERSISTENT USER WORKSPACE — load once after authentication
# =====================================================================
# Streamlit sessions disappear when a browser tab closes. Restore the user's
# last saved module inputs, tables, selections, research state, and Copilot
# conversation before authenticated widgets are instantiated.
if st.session_state.get("current_user") and st.session_state.get("authenticated"):
    _workspace_user = st.session_state["current_user"]
    _workspace_loaded_for = st.session_state.get("_workspace_loaded_for_user")
    if _workspace_loaded_for != _workspace_user:
        ensure_workspace_state_db()
        load_user_workspace(_workspace_user, st.session_state)
        st.session_state["_workspace_loaded_for_user"] = _workspace_user

# =====================================================================
# ENSURE AFFILIATE CODE IS LOADED IN SESSION STATE
# ====================================================================="""
          if "PERSISTENT USER WORKSPACE — load once after authentication" not in text:
              if load_marker not in text:
                  raise SystemExit("Load marker not found")
              text = text.replace(load_marker, load_patch, 1)

          logout_old = '''if st.sidebar.button("Lock / Logout Workspace"):
    log_audit(st.session_state.get("current_user", "Unknown"), "User Logged Out")
    st.session_state.authenticated = False
    st.rerun()'''
          logout_new = '''if st.sidebar.button("Lock / Logout Workspace"):
    _logout_user = st.session_state.get("current_user", "")
    if _logout_user:
        save_user_workspace(_logout_user, st.session_state)
        log_audit(_logout_user, "User Logged Out")
    # Clear the ephemeral session only after the durable workspace snapshot is
    # written. The next login loads the saved workspace from SQLite.
    for _key in list(st.session_state.keys()):
        del st.session_state[_key]
    st.rerun()'''
          if logout_old in text:
              text = text.replace(logout_old, logout_new, 1)
          elif "for _key in list(st.session_state.keys()):" not in text:
              raise SystemExit("Logout block not found")

          autosave_marker = "# =====================================================================\n# PLATFORM EXCELLENCE HUB — unified cross-cutting command center"
          if "AUTOSAVE LAST KNOWN USER WORKSPACE STATE" not in text:
              autosave = """# =====================================================================
# AUTOSAVE LAST KNOWN USER WORKSPACE STATE
# =====================================================================
# Every Streamlit interaction causes a rerun. Saving at the end of a normal
# rerun means the latest state is durable even when the browser is closed
# immediately afterward. Login credentials, payment uploads, and transient
# authentication fields are explicitly excluded by workspace_persistence.py.
if st.session_state.get("authenticated") and st.session_state.get("current_user"):
    save_user_workspace(st.session_state["current_user"], st.session_state)

"""
              if autosave_marker not in text:
                  raise SystemExit("Autosave marker not found")
              text = text.replace(autosave_marker, autosave_marker.split("# PLATFORM")[0] + autosave + "# PLATFORM" + autosave_marker.split("# PLATFORM")[1], 1)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify syntax
        run: python -m py_compile app.py workspace_persistence.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py workspace_persistence.py
          git commit -m "Persist user workspace across logout and browser close" || exit 0
          git push origin HEAD:feat/persistent-user-workspaces
