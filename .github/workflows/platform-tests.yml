name: Shoir-IE Platform Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "staging-e2e-20261019"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile app.py industrial_platform.py shoir_upgrade.py aegis_opt.py aegis_sim.py enterprise_engine.py database.py
      - name: Run platform-specific regression tests
        run: >-
          pytest -q
          tests/test_industrial_platform.py
          tests/test_platform_excellence.py
          tests/test_platform_foundations.py
          tests/test_platform_record_persistence.py
          tests/test_complete_module_entitlement_matrix.py
          tests/test_module_parity.py
          tests/test_module_catalog_categories.py
          tests/test_module_tier_inventory_contract.py
