name: Subscription transaction integration

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/test_atomic_subscription_migration_postgres.py"
      - "tests/test_full_migration_history_postgres.py"
      - "tests/test_migration_source_inventory.py"
      - ".github/workflows/subscription-transaction-integration.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/test_atomic_subscription_migration_postgres.py"
      - "tests/test_full_migration_history_postgres.py"
      - "tests/test_migration_source_inventory.py"
      - ".github/workflows/subscription-transaction-integration.yml"

permissions:
  contents: read

jobs:
  postgres-transaction-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOIR_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/shoir_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated integration-test dependencies
        run: python -m pip install --upgrade pip pytest psycopg2-binary
      - name: Verify complete versioned migration replay and security contracts
        run: python -m pytest -q tests/test_migration_source_inventory.py tests/test_full_migration_history_postgres.py tests/test_atomic_subscription_migration_postgres.py
