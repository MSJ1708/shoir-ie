name: Authenticated release gate

on:
  workflow_dispatch:
  # A one-shot opt-in for live staging verification when a fresh manual
  # dispatch is unavailable. Ordinary pushes remain no-ops for this workflow.
  push:
    branches:
      - staging-e2e-20261019

permissions:
  contents: read

concurrency:
  group: shoir-authenticated-release-gate
  cancel-in-progress: false

jobs:
  authenticated-release-gate:
    # The push event is intentionally opt-in: only a commit message carrying
    # this exact marker may run the stateful staging gate. workflow_dispatch
    # remains available for normal manual runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-authenticated-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHOIR_E2E_EDGE_URL: ${{ secrets.SHOIR_E2E_EDGE_URL }}
      SHOIR_E2E_PUBLISHABLE_KEY: ${{ secrets.SHOIR_E2E_PUBLISHABLE_KEY }}
      SHOIR_E2E_APP_URL: ${{ secrets.SHOIR_E2E_APP_URL }}
      SHOIR_E2E_EXPECTED_STAGING_APP_HOST: ${{ vars.SHOIR_E2E_EXPECTED_STAGING_APP_HOST }}
      SHOIR_E2E_ACTIVE_USERNAME: ${{ secrets.SHOIR_E2E_ACTIVE_USERNAME }}
      SHOIR_E2E_ACTIVE_PASSWORD: ${{ secrets.SHOIR_E2E_ACTIVE_PASSWORD }}
      SHOIR_E2E_ACTIVE_EXPECTED_TIER: ${{ vars.SHOIR_E2E_ACTIVE_EXPECTED_TIER }}
      SHOIR_E2E_MODULE_USERNAME: ${{ secrets.SHOIR_E2E_MODULE_USERNAME }}
      SHOIR_E2E_MODULE_PASSWORD: ${{ secrets.SHOIR_E2E_MODULE_PASSWORD }}
      SHOIR_E2E_RESEARCH_MODULE_USERNAME: ${{ secrets.SHOIR_E2E_RESEARCH_MODULE_USERNAME }}
      SHOIR_E2E_RESEARCH_MODULE_PASSWORD: ${{ secrets.SHOIR_E2E_RESEARCH_MODULE_PASSWORD }}
      SHOIR_E2E_SECOND_USERNAME: ${{ secrets.SHOIR_E2E_SECOND_USERNAME }}
      SHOIR_E2E_SECOND_PASSWORD: ${{ secrets.SHOIR_E2E_SECOND_PASSWORD }}
      SHOIR_E2E_STARTER_USERNAME: ${{ secrets.SHOIR_E2E_STARTER_USERNAME }}
      SHOIR_E2E_STARTER_PASSWORD: ${{ secrets.SHOIR_E2E_STARTER_PASSWORD }}
      SHOIR_E2E_EXPIRED_USERNAME: ${{ secrets.SHOIR_E2E_EXPIRED_USERNAME }}
      SHOIR_E2E_EXPIRED_PASSWORD: ${{ secrets.SHOIR_E2E_EXPIRED_PASSWORD }}
      SHOIR_E2E_INACTIVE_USERNAME: ${{ secrets.SHOIR_E2E_INACTIVE_USERNAME }}
      SHOIR_E2E_INACTIVE_PASSWORD: ${{ secrets.SHOIR_E2E_INACTIVE_PASSWORD }}
      SHOIR_E2E_VERIFY_LOGIN_THROTTLE: ${{ vars.SHOIR_E2E_VERIFY_LOGIN_THROTTLE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify dedicated test-account configuration
        id: staging_preflight
        shell: bash
        run: |
          set -euo pipefail
          required=(SHOIR_E2E_EDGE_URL SHOIR_E2E_PUBLISHABLE_KEY SHOIR_E2E_APP_URL SHOIR_E2E_EXPECTED_STAGING_APP_HOST SHOIR_E2E_ACTIVE_USERNAME SHOIR_E2E_ACTIVE_PASSWORD SHOIR_E2E_SECOND_USERNAME SHOIR_E2E_SECOND_PASSWORD SHOIR_E2E_STARTER_USERNAME SHOIR_E2E_STARTER_PASSWORD SHOIR_E2E_EXPIRED_USERNAME SHOIR_E2E_EXPIRED_PASSWORD SHOIR_E2E_MODULE_USERNAME SHOIR_E2E_MODULE_PASSWORD SHOIR_E2E_RESEARCH_MODULE_USERNAME SHOIR_E2E_RESEARCH_MODULE_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret/variable: $name"
              exit 2
            fi
          done
          for name in SHOIR_E2E_ACTIVE_USERNAME SHOIR_E2E_SECOND_USERNAME SHOIR_E2E_STARTER_USERNAME SHOIR_E2E_EXPIRED_USERNAME SHOIR_E2E_MODULE_USERNAME SHOIR_E2E_RESEARCH_MODULE_USERNAME; do
            value="${!name}"
            if [[ "${value,,}" != shoir-e2e-* ]]; then
              echo "::error::$name must use a dedicated shoir-e2e-* test account; production/customer/admin identities are refused."
              exit 2
            fi
          done
          python scripts/staging_e2e_guard.py
      - name: Verify staging candidate build
        id: candidate_build
        if: ${{ steps.staging_preflight.conclusion == 'success' }}
        run: python scripts/staging_candidate_build_preflight.py
      # Backend authentication is independent of Streamlit UI deployment. Keep
      # it running after a stale UI failure so credential problems are diagnosed
      # in seconds rather than hidden behind a long browser wait.
      - name: Verify authenticated Edge API lifecycle and workspace isolation
        id: backend_check
        if: ${{ always() && steps.staging_preflight.conclusion == 'success' }}
        run: python scripts/authenticated_release_gate.py
      # Browser suites are meaningful only when the test identities authenticate
      # and the exact candidate build is deployed. Never repeat a deployment wait
      # for every account or for every module.
      - name: Verify authenticated 96-module rendering matrix
        id: module_matrix
        if: ${{ always() && steps.staging_preflight.conclusion == 'success' && steps.candidate_build.conclusion == 'success' && steps.backend_check.conclusion == 'success' }}
        run: python scripts/authenticated_module_matrix.py
      - name: Verify authenticated browser shell, Excel module and logout
        id: browser_check
        if: ${{ always() && steps.staging_preflight.conclusion == 'success' && steps.candidate_build.conclusion == 'success' && steps.backend_check.conclusion == 'success' }}
        run: python scripts/authenticated_browser_matrix.py
      - name: Upload redacted verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-authenticated-release-evidence
          path: artifacts/authenticated-release-gate/
          if-no-files-found: warn
          retention-days: 14
