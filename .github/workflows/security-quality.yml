name: Shoir-IE security and quality gates

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Compile
        run: python -m compileall -q .
      - name: Regression tests
        run: python -m pytest -q tests
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret-pattern guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("app.py"), Path("industrial_platform.py"), Path("industrial_experience.py")]
          patterns = [
              re.compile(r'(?i)(api[_-]?key|secret|password)\s*=\s*["\'][^"\']{12,}["\']'),
          ]
          hits=[]
          for p in roots:
              text=p.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(p))
          if hits:
              raise SystemExit("Potential hard-coded credential pattern found: " + ", ".join(sorted(set(hits))))
          print("No obvious hard-coded credential patterns found in scanned application files.")
          PY
