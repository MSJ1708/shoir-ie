name: Shoir-IE security and quality gates

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "staging-e2e-20261019", "feat/shoir-100-tools-integration-20261025"]

permissions:
  contents: read

jobs:
  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoir_test
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      SHOIR_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/shoir_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Compile
        run: python -m compileall -q .
      - name: Regression tests
        run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q tests
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret-pattern guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("app.py"), Path("industrial_platform.py"), Path("industrial_experience.py")]
          patterns = [
              re.compile(r'(?i)(api[_-]?key|secret|password)\s*=\s*["\'][^"\']{12,}["\']'),
          ]
          hits=[]
          for p in roots:
              text=p.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(p))
          if hits:
              raise SystemExit("Potential hard-coded credential pattern found: " + ", ".join(sorted(set(hits))))
          print("No obvious hard-coded credential patterns found in scanned application files.")
          PY
