name: Shoir-IE tests
on:
  push:
    branches: ["feature/platform-upgrade-v2"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py shoir_upgrade.py
      - run: python -m pip install pytest
      - run: pytest -q tests
