name: Workflow Agent Staging Assurance

on:
  push:
    branches:
      - staging-e2e-20261019
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: workflow-agent-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    if: github.ref == 'refs/heads/staging-e2e-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Shoir-IE staging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: staging-e2e-20261019
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Checkout private Workflow Automation Agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: MSJ1708/shoir-release-assurance-agent
          ref: build/workflow-agent-v0.2.1-clean
          token: ${{ secrets.WORKFLOW_AGENT_READ_TOKEN }}
          path: .workflow-agent
          persist-credentials: false

      - name: Install the agent
        run: python -m pip install ./.workflow-agent

      - name: Capture local runtime evidence
        run: workflow-agent doctor > workflow-agent-doctor.json

      - name: Capture read-only Shoir-IE staging repository evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          workflow-agent github MSJ1708/shoir-ie --branch staging-e2e-20261019 > workflow-agent-staging-evidence.json

      - name: Upload redacted evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-agent-staging-evidence-${{ github.run_id }}
          path: |
            workflow-agent-doctor.json
            workflow-agent-staging-evidence.json
          if-no-files-found: error
          retention-days: 14
