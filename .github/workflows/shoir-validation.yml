name: Shoir-IE validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        env:
          SHOIR_EXPORT_EVIDENCE_DIR: artifacts/report-export-validation
          SHOIR_EXPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q tests
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check persistence Edge Function
        run: deno check supabase/functions/shoir-persistence/index.ts
      - name: Run persistence Edge Function security tests
        run: deno test supabase/functions/shoir-persistence/security_test.ts
      - name: Install PDF rendering tools for visual export acceptance
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - name: Render the exact-head synthetic PDF and every PowerPoint slide
        if: always()
        run: |
          set -euo pipefail
          evidence=artifacts/report-export-validation
          if [ -f "$evidence/complete_export_verification.pptx" ]; then
            mkdir -p "$evidence/pptx-rendered"
            libreoffice --headless --convert-to pdf --outdir "$evidence/pptx-rendered" "$evidence/complete_export_verification.pptx"
            pdf="$evidence/pptx-rendered/complete_export_verification.pdf"
            test -s "$pdf"
            pdfinfo "$pdf"
            pdftoppm -png -r 110 "$pdf" "$evidence/pptx-rendered/slide"
            test "$(find "$evidence/pptx-rendered" -maxdepth 1 -name 'slide-*.png' | wc -l)" -ge 1
          fi
          if [ -f "$evidence/complete_export_verification.pdf" ]; then
            pdfinfo "$evidence/complete_export_verification.pdf"
          fi
      - name: Upload sanitized report-export validation artifacts and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-report-export-validation
          path: artifacts/report-export-validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Parse required application modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          required = ["app.py","industrial_platform.py","industrial_platform_excellence.py","industrial_operating_system.py","shoir_upgrade.py"]
          for name in required:
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("Required application modules parsed successfully.")
          PY
      - name: Execute application top-level import smoke test
        run: python scripts/runtime_import_smoke.py
      - name: Install Chromium for local runtime smoke
        run: python -m playwright install --with-deps chromium
      - name: Start local Streamlit application
        run: |
          mkdir -p artifacts/live-deployment-smoke
          nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            > artifacts/live-deployment-smoke/streamlit.log 2>&1 &
          echo $! > /tmp/shoir-streamlit.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/shoir-streamlit.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/live-deployment-smoke/streamlit.log
            exit 1
          fi
      - name: Browser-smoke the local app at desktop and mobile widths
        env:
          SHOIR_LIVE_URL: http://127.0.0.1:8501/
        run: python scripts/live_deployment_smoke.py
      - name: Upload local runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-local-runtime-smoke
          path: artifacts/live-deployment-smoke/
          if-no-files-found: warn

  live-deployment-smoke:
    # Probe the currently hosted, anonymous shell for audit PRs and after
    # every main push. This is a service-availability/rendering check, not proof
    # that the hosted app has deployed the triggering Git SHA. Manual runs on
    # main allow an explicit post-deployment check without account credentials.
    if: >-
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'audit/') || github.base_ref == 'staging-e2e-20261019')) ||
      (github.event_name == 'push' && (startsWith(github.ref_name, 'audit/') || github.ref_name == 'main' || github.ref_name == 'staging-e2e-20261019')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'staging-e2e-20261019'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOIR_E2E_EDGE_URL: ${{ secrets.SHOIR_E2E_EDGE_URL }}
      SHOIR_E2E_APP_URL: ${{ secrets.SHOIR_E2E_APP_URL }}
      SHOIR_E2E_EXPECTED_STAGING_APP_HOST: ${{ vars.SHOIR_E2E_EXPECTED_STAGING_APP_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Select and validate the hosted smoke target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF:-}" == "staging-e2e-20261019" ]] ||
             [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME:-}" == "staging-e2e-20261019" ]] ||
             [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_NAME:-}" == "staging-e2e-20261019" ]]; then
            python scripts/staging_e2e_guard.py
            echo "SHOIR_LIVE_URL=${SHOIR_E2E_APP_URL%/}/" >> "$GITHUB_ENV"
          else
            echo "SHOIR_LIVE_URL=https://shoir-ie-app.streamlit.app/" >> "$GITHUB_ENV"
          fi
      - name: Probe live staging Edge Function CORS
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'staging-e2e-20261019') ||
          (github.event_name == 'push' && github.ref_name == 'staging-e2e-20261019') ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging-e2e-20261019')
        env:
          SHOIR_CORS_EDGE_URL: ${{ secrets.SHOIR_E2E_EDGE_URL }}
          SHOIR_CORS_ALLOWED_ORIGIN: ${{ secrets.SHOIR_E2E_APP_URL }}
          SHOIR_E2E_EXPECTED_STAGING_APP_HOST: ${{ vars.SHOIR_E2E_EXPECTED_STAGING_APP_HOST }}
        run: python scripts/live_cors_probe.py
      - name: Test hosted entry-screen rendering at desktop and mobile widths
        run: python scripts/live_deployment_smoke.py
      - name: Save live browser screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-live-deployment-smoke
          path: artifacts/live-deployment-smoke/
          if-no-files-found: warn

