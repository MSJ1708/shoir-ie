name: Shoir-IE validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply login sidebar visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")
          marker = 'if "show_qr" not in st.session_state:\n    st.session_state.show_qr = False'
          patch = marker + '''

# Hide the Streamlit sidebar on the public authentication/registration screen.
# The authenticated application keeps its full sidebar navigation and controls.
if not st.session_state.get("authenticated", False):
    st.markdown("""
    <style>
        section[data-testid="stSidebar"] { display: none !important; }
        [data-testid="stSidebarCollapsedControl"] { display: none !important; }
        button[data-testid="stSidebarCollapseButton"] { display: none !important; }
        div[data-testid="stAppViewContainer"] { margin-left: 0 !important; }
    </style>
    """, unsafe_allow_html=True)
'''
          if "Hide the Streamlit sidebar on the public authentication/registration screen." not in text:
              if marker not in text:
                  raise SystemExit("Session-state marker not found")
              p.write_text(text.replace(marker, patch, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Hide sidebar on login and registration screen" || true
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Parse required application modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          required = ["app.py","industrial_platform.py","industrial_platform_excellence.py","industrial_operating_system.py","shoir_upgrade.py"]
          for name in required:
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("Required application modules parsed successfully.")
          PY
