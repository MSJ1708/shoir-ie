name: Shoir-IE validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: |
          python -m py_compile app.py industrial_platform.py industrial_platform_excellence.py industrial_operating_system.py shoir_upgrade.py
      - name: Run regression tests
        run: pytest -q tests/test_industrial_operating_system.py
