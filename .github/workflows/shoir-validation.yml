name: Shoir-IE validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        env:
          SHOIR_EXPORT_EVIDENCE_DIR: artifacts/report-export-validation
          SHOIR_EXPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q tests
      - name: Install PDF rendering tools for visual export acceptance
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - name: Render the exact-head synthetic PDF and every PowerPoint slide
        if: always()
        run: |
          set -euo pipefail
          evidence=artifacts/report-export-validation
          test -s "$evidence/complete_export_verification.pptx"
          test -s "$evidence/complete_export_verification.pdf"
          mkdir -p "$evidence/pptx-rendered"
          libreoffice --headless --convert-to pdf --outdir "$evidence/pptx-rendered" "$evidence/complete_export_verification.pptx"
          deck_pdf="$evidence/pptx-rendered/complete_export_verification.pdf"
          test -s "$deck_pdf"
          pdfinfo "$deck_pdf"
          pdftoppm -png -r 110 "$deck_pdf" "$evidence/pptx-rendered/slide"
          slide_count="$(find "$evidence/pptx-rendered" -maxdepth 1 -name 'slide-*.png' | wc -l)"
          test "$slide_count" -ge 1
          python - <<'PY'
          import subprocess
          from pathlib import Path
          evidence = Path("artifacts/report-export-validation")
          def extract(path):
              return subprocess.run(
                  ["pdftotext", "-layout", str(path), "-"],
                  check=True, capture_output=True, text=True
              ).stdout
          expected = [f"ROW-{i:03d}" for i in range(1, 68)]
          for path in (evidence / "complete_export_verification.pdf",
                       evidence / "pptx-rendered" / "complete_export_verification.pdf"):
              rendered = extract(path)
              missing = [marker for marker in expected if marker not in rendered]
              if missing:
                  raise SystemExit(f"{path}: rendered export is missing rows: {missing}")
          print(f"Rendered PDF and PowerPoint PDFs contain all {len(expected)} expected row markers.")
          PY
      - name: Upload sanitized report-export validation artifacts and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-report-export-validation
          path: artifacts/report-export-validation/
          if-no-files-found: error
          retention-days: 14
      - name: Parse required application modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          required = ["app.py","industrial_platform.py","industrial_platform_excellence.py","industrial_operating_system.py","shoir_upgrade.py"]
          for name in required:
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("Required application modules parsed successfully.")
          PY
      - name: Execute application top-level import smoke test
        run: python scripts/runtime_import_smoke.py
      - name: Install Chromium for local runtime smoke
        run: python -m playwright install --with-deps chromium
      - name: Start local Streamlit application
        run: |
          mkdir -p artifacts/live-deployment-smoke
          nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            > artifacts/live-deployment-smoke/streamlit.log 2>&1 &
          echo $! > /tmp/shoir-streamlit.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/shoir-streamlit.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/live-deployment-smoke/streamlit.log
            exit 1
          fi
      - name: Browser-smoke the local app at desktop and mobile widths
        env:
          SHOIR_LIVE_URL: http://127.0.0.1:8501/
        run: python scripts/live_deployment_smoke.py
      - name: Upload local runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-local-runtime-smoke
          path: artifacts/live-deployment-smoke/
          if-no-files-found: warn

  live-deployment-smoke:
    # Probe the currently hosted, anonymous shell for audit PRs and after
    # every main push. This is a service-availability/rendering check, not proof
    # that the hosted app has deployed the triggering Git SHA. Manual runs on
    # main allow an explicit post-deployment check without account credentials.
    if: >-
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/')) ||
      (github.event_name == 'push' && (startsWith(github.ref_name, 'audit/') || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHoir_LIVE_URL: https://shoir-ie-app.streamlit.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test hosted entry-screen rendering at desktop and mobile widths
        env:
          SHOIR_LIVE_URL: https://shoir-ie-app.streamlit.app/
        run: python scripts/live_deployment_smoke.py
      - name: Save live browser screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoir-ie-live-deployment-smoke
          path: artifacts/live-deployment-smoke/
          if-no-files-found: warn

